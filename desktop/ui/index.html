<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LabHub</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #f5f5f4;
        color: #1c1917;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1917;
          color: #f5f5f4;
        }
        .wordmark {
          color: #2dd4bf;
        }
        .subtitle {
          color: #a8a29e;
        }
      }
      .box {
        text-align: center;
      }
      .wordmark {
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #0d9488;
      }
      .subtitle {
        margin-top: 0.5rem;
        font-size: 1.125rem;
        color: #78716c;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <h1 class="wordmark">LabHub Desktop</h1>
      <p class="subtitle">scaffold</p>
    </main>
  </body>
</html>
