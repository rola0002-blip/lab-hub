[package]
name = "labhub-desktop"
version = "0.1.0"
description = "LabHub desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v5"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json"] }
log = "0.4"

[[bin]]
name = "labhub-desktop"
path = "src/main.rs"

[[bin]]
name = "spike"
path = "src/bin/spike.rs"
