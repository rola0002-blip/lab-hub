name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labhub
          POSTGRES_PASSWORD: labhub
          POSTGRES_DB: labhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labhub -d labhub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Build-time placeholders (same trick as Dockerfile build stage) — the
      # integration config and playwright webServer both override with TEST_DATABASE_URL.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      BETTER_AUTH_SECRET: ci-build-placeholder-not-a-real-secret-0123456789
      TEST_DATABASE_URL: postgresql://labhub:labhub@localhost:5432/labhub_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run contrast
      - run: npm run coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labhub
          POSTGRES_PASSWORD: labhub
          POSTGRES_DB: labhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labhub -d labhub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      BETTER_AUTH_SECRET: ci-build-placeholder-not-a-real-secret-0123456789
      TEST_DATABASE_URL: postgresql://labhub:labhub@localhost:5432/labhub_test
      # 2-core dev-mode runners need wider e2e budgets than the local defaults
      # (60s test / 5s expect): on the first CI run, post-mutation re-renders and
      # SSE-driven list updates exceeded the 5s expect window on three specs.
      E2E_WEB_SERVER: 'build'
      E2E_TEST_TIMEOUT_MS: '180000'
      E2E_EXPECT_TIMEOUT_MS: '15000'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
