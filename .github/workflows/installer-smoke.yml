name: Installer smoke

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
          - runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Run installer from a clean machine (LAN mode)
        run: |
          sh ./install.sh \
            --url "http://localhost:3000" \
            --port 3000 \
            --dir "$RUNNER_TEMP/labhub" \
            --version "${{ github.event.release.tag_name || 'latest' }}"
      - name: Assert health
        run: |
          curl -fsS http://127.0.0.1:3000/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
      - name: Dump app logs (always)
        if: always()
        run: |
          docker compose -p labhub -f "$RUNNER_TEMP/labhub/docker-compose.dist.yml" --profile prod logs app || true
