services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: labhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labhub}
      POSTGRES_DB: labhub
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U labhub -d labhub']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ['prod']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://labhub:${POSTGRES_PASSWORD:-labhub}@db:5432/labhub
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      UPLOADS_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-LabHub <no-reply@localhost>}
    volumes:
      - uploads:/data/uploads
    ports:
      - '3000:3000'
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    command: tunnel run --token ${TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db-data:
  uploads:
