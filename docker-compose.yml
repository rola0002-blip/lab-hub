services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: labhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labhub}
      POSTGRES_DB: labhub
    ports:
      # Loopback-only (SP7 §4.1): reachable on-box (Mac dev, integration tests, Playwright)
      # but NOT from the LAN or internet. Ingress is exclusively the outbound tunnel.
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U labhub -d labhub']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    profiles: ['prod']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://labhub:${POSTGRES_PASSWORD:-labhub}@db:5432/labhub
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      UPLOADS_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-COLOSSUS <no-reply@localhost>}
      # SP7 §6.1 — the load-bearing passthrough. Without these, .env's VAPID/rate-limit/
      # trusted-IP values never reach the container and it silently falls back to zod
      # defaults ('' ⇒ push dead; 10; x-forwarded-for). The :- defaults keep Mac dev
      # unaffected (blank VAPID ⇒ push dormant; 10 ⇒ current limiter; blank header ⇒ XFF).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_TRUSTED_IP_HEADER: ${AUTH_TRUSTED_IP_HEADER:-}
      # SP7 F1 — optional one-time bootstrap gate. Set (init-env.sh mints it) ⇒ the setup wizard
      # requires the token before creating the first admin, so no un-invited party can seize admin
      # over the public tunnel during provisioning. Blank ⇒ gate off (Mac dev unaffected).
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    volumes:
      - uploads:/data/uploads
    ports:
      # Loopback-only (SP7 §4.1): keeps the on-box /api/health poll for update.sh/rollback.sh
      # and the Mac dev workflow, while exposing nothing off-box. APP_PORT is the loopback
      # health-poll port only (default 3000) — NOT the public ingress port (the tunnel serves that).
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    restart: unless-stopped

  cloudflared:
    # Pinned to a released tag (SP7 §4.1) so the internet-facing connector is reproducible.
    # Pin derived 2026-07-16 from `docker run --rm cloudflare/cloudflared:latest --version`.
    image: cloudflare/cloudflared:2026.7.2
    profiles: ['tunnel']
    command: tunnel run --token ${TUNNEL_TOKEN}
    depends_on:
      # Wait for the app HEALTHCHECK (Dockerfile, §7.2) so the tunnel never advertises a
      # not-yet-ready origin on a cold `up`.
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  uploads:
