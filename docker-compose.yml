services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: labhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labhub}
      POSTGRES_DB: labhub
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U labhub -d labhub']
      interval: 5s
      timeout: 3s
      retries: 10

  # app + cloudflared services are added in Task 21 (production deployment)

volumes:
  db-data:
  uploads:
