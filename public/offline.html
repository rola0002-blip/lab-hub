<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LabHub — offline</title>
  <style>
    /* Self-contained: no external assets — this page must render from the SW
       precache with zero network. Colors mirror the app canvas (globals.css). */
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #1a1d21; color: #e7e9ea; font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom)); box-sizing: border-box; text-align: center; }
    .card h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    .card p { margin: 0 0 1.25rem; color: #9ca3af; }
    button { background: #14b8a6; color: #06231f; border: 0; border-radius: .5rem; padding: .625rem 1.25rem;
      font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 2px solid #5eead4; outline-offset: 2px; }
    svg { width: 40px; height: 40px; margin-bottom: 1rem; opacity: .9; }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="1.5" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h8m4 0h6M3 17h6m4 0h8M14 4v6M10 14v6" />
    </svg>
    <h1>You're offline</h1>
    <p>LabHub needs a connection to load your lab.</p>
    <button id="retry" type="button">Try again</button>
  </div>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.reload() })
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
